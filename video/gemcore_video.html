<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GemCore Video</title>

<style>
/* A jeweller's showcase: ivory paper and deep velvet green, champagne gold hairlines, soft spotlights, slow sparkles.
   Fixed 1280x720 stage scaled to fit, HUD over it. */
:root{--ivory:#F7F3EA;--paper:#FFFDF8;--ink:#1B1A17;--velvet:#151C16;--gold:#C9A65A;--champ:#E8D7A8;--bronze:#8A6A2F;--muted:#77736A;--line:rgba(201,166,90,.45);
--head:'Cormorant Garamond',Garamond,'Times New Roman',serif;--body:'Inter',system-ui,'Segoe UI',sans-serif;color-scheme:light}
html,body{height:100%}
body{margin:0;background:#0E120F;color:var(--ink);font-family:var(--body);overflow:hidden}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{width:1280px;height:720px;overflow:hidden;background:var(--ivory);position:absolute;left:50%;top:50%;transform-origin:center;border-radius:14px}
#scene{position:absolute;inset:0}
#curtain{position:absolute;inset:0;z-index:15;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(232,215,168,.9) 45%,rgba(255,253,248,1) 50%,rgba(232,215,168,.9) 55%,transparent);transform:translateX(-120%)}
#curtain.go{animation:curtain 1s cubic-bezier(.65,0,.35,1)}
@keyframes curtain{to{transform:translateX(120%)}}
#top{position:absolute;left:30px;top:24px;z-index:20;display:flex;gap:12px;align-items:center}
#logo{width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font:600 24px var(--head);color:var(--gold);background:rgba(255,253,248,.9)}
#stitle{font:500 11px/1 var(--body);letter-spacing:.28em;text-transform:uppercase;color:var(--bronze);padding:9px 0;border-bottom:1px solid var(--line)}
.darkhud #stitle{color:var(--champ)}
#cap{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);width:min(960px,88%);text-align:center;font:500 17px/1.45 var(--body);color:#fff;background:rgba(18,20,17,.78);padding:8px 16px;border-radius:10px;z-index:20}
#cap[hidden]{display:none}
#bar{position:absolute;left:30px;right:30px;bottom:14px;height:3px;display:flex;gap:4px;z-index:20}
#bar button{flex:var(--w);border:0;padding:0;border-radius:2px;background:rgba(138,106,47,.22);cursor:pointer;position:relative;overflow:hidden;height:3px}
#bar button i{position:absolute;inset:0;width:0;background:var(--gold)}
#bar button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#help{position:absolute;right:30px;top:28px;z-index:20;font:500 11px var(--body);letter-spacing:.08em;color:var(--muted)}
.darkhud #help{color:#b9b29f}
#pausedTag{position:absolute;inset:0;display:none;place-items:center;z-index:30;background:rgba(14,18,15,.4);font:500 54px var(--head);color:#fff;letter-spacing:.06em}
body.paused #pausedTag{display:grid}
body.paused #scene *,body.paused #scene{animation-play-state:paused!important}
#load{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:var(--ivory);font:500 13px var(--body);letter-spacing:.1em;color:var(--muted)}
#load i{display:block;width:280px;height:2px;background:#e7dfcc;margin-top:12px;overflow:hidden}#load u{display:block;height:100%;width:0;background:var(--gold)}
.abs{position:absolute}
.bg{position:absolute;inset:0}
.eyebrow{font:500 12px var(--body);letter-spacing:.3em;text-transform:uppercase;color:var(--bronze)}
.h1{font:500 74px/.98 var(--head);letter-spacing:-.01em;margin:0;text-wrap:balance}
.h2{font:500 50px/1.02 var(--head);margin:0;text-wrap:balance}
.it{font-style:italic;color:var(--bronze)}
.lead{font:400 18px/1.55 var(--body);color:var(--muted);max-width:470px;margin:0}
.dark .h1,.dark .h2{color:var(--paper)}.dark .it{color:var(--champ)}.dark .lead{color:#c9c3b2}.dark .eyebrow{color:var(--champ)}
.tag{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--body);letter-spacing:.04em;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:rgba(255,253,248,.85);white-space:nowrap}
.dark .tag{color:var(--champ);background:rgba(255,255,255,.04)}
.tag.solid{background:var(--ink);color:var(--champ);border-color:var(--ink)}
.mono{font-family:ui-monospace,Consolas,monospace}
.ex{position:absolute;right:30px;bottom:64px;font:500 11px var(--body);letter-spacing:.06em;color:var(--muted);background:rgba(255,253,248,.9);padding:4px 10px;border-radius:999px;border:1px solid var(--line);z-index:5}
.bub{border-radius:18px;padding:11px 15px;font:500 16px/1.4 var(--body);max-width:450px}
.me{background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.ai{background:#fff;box-shadow:0 10px 30px rgba(40,30,10,.12);border-bottom-left-radius:4px;border:1px solid #efe7d6;color:var(--ink)}
.tool{font:600 13px ui-monospace,Consolas,monospace;color:var(--bronze)}
.in{animation:in .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.pop{animation:pop .7s cubic-bezier(.3,1.5,.5,1) var(--d,0s) both}
.fade{animation:fade 1s ease var(--d,0s) both}
.draw{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 2.6s cubic-bezier(.6,0,.2,1) var(--d,0s) forwards}
@keyframes in{from{opacity:0;transform:translateY(24px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes run{to{offset-distance:100%}}
@keyframes wordup{from{opacity:0;transform:translateY(34px);filter:blur(6px)}}
@keyframes typing{from{width:0}}
@keyframes tap{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:0;transform:scale(1.8)}}
@keyframes tapdot{0%,60%{opacity:0}20%,40%{opacity:1}}
@keyframes lapin{from{opacity:0;transform:translateY(110px) scale(.92)}70%{transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes hover{50%{transform:translateY(-8px)}}
@keyframes kb{0%,10%{transform:scale(1) translate(0,0)}100%{transform:scale(var(--z,1.35)) translate(var(--tx,0),var(--ty,0))}}
@keyframes cardin{from{opacity:0;transform:translateY(80px) scale(.9)}70%{transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes drift{50%{transform:translate(var(--dx,30px),var(--dy,-20px))}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes sweepl{from{transform:translateX(-30%) rotate(18deg)}to{transform:translateX(560%) rotate(18deg)}}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(201,166,90,.22),0 24px 60px rgba(40,30,10,.25)}}
@keyframes bar{from{width:0}}
.lap{position:absolute;z-index:3;animation:lapin 1.1s cubic-bezier(.2,.9,.25,1.05) var(--d,0s) both,hover 7s ease-in-out calc(var(--d,0s) + 1.2s) infinite}
.lap .scr{background:#0F0F10;border-radius:14px 14px 4px 4px;padding:9px;box-shadow:0 34px 80px rgba(30,24,12,.38),inset 0 0 0 1px #2b2b2d}
.lap .win{position:relative;overflow:hidden;border-radius:4px;background:#fff;aspect-ratio:16/10}
.lap .win img{width:100%;display:block;transform-origin:var(--ox,50%) var(--oy,50%);animation:kb var(--kd,10s) ease-in-out calc(var(--d,0s) + 1.2s) both}
.lap .base{height:14px;margin:0 -6%;background:linear-gradient(#d9d6d0,#a9a59c);border-radius:0 0 14px 14px;position:relative;box-shadow:0 18px 30px rgba(30,24,12,.25)}
.lap .base::after{content:"";position:absolute;left:50%;top:0;width:16%;height:5px;transform:translateX(-50%);background:#c6c2b9;border-radius:0 0 6px 6px}
.jewel{position:absolute;z-index:2;mix-blend-mode:multiply;animation:cardin 1s cubic-bezier(.2,.9,.25,1.05) var(--d,0s) both}
.jewel canvas{width:100%;height:100%;display:block}
.jewel .lbl{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font:500 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--bronze);white-space:nowrap}
.jlbl{position:absolute;z-index:3;text-align:center;font:500 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--bronze)}.dark .jlbl{color:var(--champ)}
.plinth{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 46%,#FFFFFF 0%,#F4EEDF 40%,rgba(244,238,223,0) 68%);z-index:1}
.dark .plinth{background:radial-gradient(circle at 50% 46%,#FFFDF6 0%,#EDE3CB 40%,rgba(237,227,203,0) 68%)}
.prog{height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent) no-repeat;background-size:40% 100%;animation:sweepbar 1.1s linear infinite}
@keyframes sweepbar{from{background-position:-60% 0}to{background-position:160% 0}}
.panel{background:rgba(255,253,248,.94);border:1px solid #ece3cf;border-radius:16px;box-shadow:0 18px 50px rgba(40,30,10,.14);padding:16px 18px;color:var(--ink)}
#vbtn{position:absolute;right:30px;top:58px;z-index:25;font:600 12px var(--body,Inter),sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:20px;border:1px solid var(--gold);background:rgba(255,253,248,.85);color:#5a4a2a;cursor:pointer}
#vbtn.off{opacity:.6;text-decoration:line-through}
#start{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(14,18,15,.45)}
#start[hidden]{display:none}
#playv{font:500 40px var(--head);padding:22px 44px;border-radius:60px;border:1px solid var(--gold);background:rgba(255,253,248,.95);color:#2b2414;cursor:pointer;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#playv:hover{transform:scale(1.04)}
body.paused #pausedTag{pointer-events:none}
@media (prefers-reduced-motion:reduce){#scene *{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style></head><body>
